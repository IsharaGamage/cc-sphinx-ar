<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    AFRAME.registerComponent('video-handler', {
      init: function () {
        const video = document.querySelector('#englishVideo');

        this.el.addEventListener('targetFound', () => {
          console.log('TARGET FOUND');
          video.currentTime = 0;

          video.play()
            .then(() => console.log('VIDEO PLAYING'))
            .catch(err => console.error('VIDEO PLAY ERROR:', err));
        });

        this.el.addEventListener('targetLost', () => {
          console.log('TARGET LOST');
          video.pause();
        });
      }
    });
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #startButton {
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      padding: 14px 24px;
      border: none;
      border-radius: 28px;
      font-size: 17px;
      font-weight: bold;
      background: #d5a229;
      color: white;
    }
  </style>
</head>

<body>

<button id="startButton">Start AR Experience</button>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind?v=5;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets timeout="20000">

    <video
      id="englishVideo"
      src="./english.mp4?v=5"
      preload="auto"
      muted
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>

  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    mindar-image-target="targetIndex: 0"
    video-handler>

    <a-video
      src="#englishVideo"
      width="1"
      height="0.75"
      position="0 0 0.01">
    </a-video>

  </a-entity>

</a-scene>

<script>
  const video = document.querySelector('#englishVideo');
  const button = document.querySelector('#startButton');

  button.addEventListener('click', async () => {
    try {
      video.muted = true;

      // Unlock video on mobile browser
      await video.play();
      video.pause();
      video.currentTime = 0;

      button.style.display = 'none';

      console.log('VIDEO UNLOCKED');
    } catch (err) {
      console.error('UNLOCK ERROR:', err);
      alert('Please tap again to enable video playback.');
    }
  });
</script>

</body>
</html>
